buildscript {
 repositories { maven { url = 'https://maven.cleanroommc.com/' }; mavenCentral() }
 dependencies { classpath 'net.minecraftforge.gradle:ForgeGradle:3.0.197' }
}
apply plugin: 'net.minecraftforge.gradle'
// Old Forge development metadata contains Scala coordinates no longer mirrored.
// This Java-only mod uses the corresponding upstream artifacts for compilation.
configurations.all {
 resolutionStrategy.eachDependency { d ->
  if (d.requested.group == 'org.scala-lang.plugins' && d.requested.version == '1.0.2_mc') d.useVersion '1.0.2'
  if (d.requested.group == 'org.scala-lang' && d.requested.name in ['scala-parser-combinators_2.11','scala-swing_2.11','scala-xml_2.11']) d.useTarget "org.scala-lang.modules:${d.requested.name}:${d.requested.version}"
 }
}
version = '0.1.27-vanilla-compatibility-alpha'
group = 'org.sonicraft.backport'
archivesBaseName = 'sonicraft-legacy-1.12.2'
sourceCompatibility = targetCompatibility = '1.8'
minecraft { mappings channel: 'snapshot', version: '20171003-1.12' }
repositories { maven { url = 'https://maven.neoforged.net/releases/' }; maven { url = 'https://maven.cleanroommc.com/' }; flatDir { dirs 'libs' } }
dependencies {
 minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2860'
 implementation fg.deobf('local:geckolib-forge-1.12.2:3.0.31')
}
repositories.all { repo ->
 if (repo instanceof MavenArtifactRepository && repo.url.toString().contains('maven.minecraftforge.net')) repo.url = uri('https://maven.cleanroommc.com/')
}
jar.finalizedBy('reobfJar')
tasks.withType(JavaCompile) { options.sourcepath = files(); options.encoding = 'UTF-8' }

task smokeCheck(type: JavaExec, dependsOn: testClasses) {
 classpath = sourceSets.test.runtimeClasspath
 main = 'org.sonicraft.backport.PortSmokeCheck'
}
